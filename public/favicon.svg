<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <title>Comparative Mythology Family Tree</title>
    <!-- Tile, with pixel-stepped corners -->
    <path d="M2 0H14V1H15V2H16V14H15V15H14V16H2V15H1V14H0V2H1V1H2Z" fill="#2C1F0E"/>
    <!-- Parent, and the lines down to its two children -->
    <rect x="6" y="3" width="4" height="3" fill="#E0A563"/>
    <rect x="7" y="6" width="2" height="2" fill="#F0CB86"/>
    <rect x="2" y="8" width="12" height="1" fill="#F0CB86"/>
    <rect x="2" y="9" width="2" height="1" fill="#F0CB86"/>
    <rect x="12" y="9" width="2" height="1" fill="#F0CB86"/>
    <!-- Two children from different pantheons, joined as equivalents -->
    <rect x="1" y="10" width="4" height="3" fill="#7FAFD0"/>
    <rect x="11" y="10" width="4" height="3" fill="#D2694A"/>
    <rect x="6" y="11" width="1" height="1" fill="#F0CB86"/>
    <rect x="9" y="11" width="1" height="1" fill="#F0CB86"/>
</svg>
